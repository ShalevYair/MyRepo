/* ============================ chat over the corpus ==========================
   Retrieval happens locally: the question picks the most relevant records out
   of what is loaded, and only those are sent to Gemini. Sending 3.7k objects
   on every turn would be slow and expensive for no gain.                    */
const GEM_MODEL = 'gemini-3.7-flash';
const GEM_BASE  = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEM_MODEL;
const KEY_LS    = 'nv.geminiKey';
const MAX_RECS  = 30;
const MAX_CTX   = 250000;          // characters, ~70k tokens
const CHAT = { hist: [], busy: false };

function getKey(){ return lsGet(KEY_LS, ''); }

function md(t){
  const blocks = [];
  let s = String(t == null ? '' : t).replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (m, c) => {
    blocks.push(c); return '\u0000B' + (blocks.length - 1) + '\u0000';
  });
  s = esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/^\s*[-*]\s+/gm, '• ')
    .replace(/\n/g, '<br>');
  return s.replace(/\u0000B(\d+)\u0000/g, (m, i) => '<pre>' + esc(blocks[Number(i)]) + '</pre>');
}

function chatPool(){
  if (!S.joined) return [];
  if ($('chatFiltered').checked && S.view && S.view.length) return S.view;
  return S.joined.matched.concat(S.joined.noAnalysis, S.joined.inactive);
}

function hayOf(r){
  if (r._hay) return r._hay;
  r._hay = [r.id, r.description, r.catDesc, r.catWhat, r.purpose, r.mainTopic, r.subTopic,
    r.area, r.trigger, r.domain, r.triage, r.objType, r.library, r.systemName, r.routineName,
    (r.rules || []).join(' '), (r.entities || []).join(' '),
    (r.inputs || []).join(' '), (r.outputs || []).join(' '),
    (r.callsOut || []).join(' '), (r.callers || []).join(' '),
    (r.ddmList || []).map(d => d.ddm).join(' ')
  ].join(' ').toLowerCase();
  return r._hay;
}

function qTokens(q){
  return String(q).toLowerCase()
    .split(/[^0-9a-z\u0590-\u05FF_$#@-]+/)
    .filter(t => t.length >= 2);
}

function pickRecords(question, limit){
  const pool = chatPool();
  if (!pool.length) return [];
  const ts = qTokens(question);
  const byK = new Map();
  for (const r of pool) byK.set(r.key, r);

  const out = [], seen = new Set();
  for (const t of ts){                       // an explicit object name always wins
    const r = byK.get(t.toUpperCase());
    if (r && !seen.has(r.key)){ seen.add(r.key); out.push(r); }
  }
  const scored = [];
  for (const r of pool){
    if (seen.has(r.key)) continue;
    const h = hayOf(r);
    let sc = 0;
    for (const t of ts) if (h.indexOf(t) !== -1) sc += (t.length >= 4 ? 2 : 1);
    if (sc > 0) scored.push([sc + Math.min(r.fanIn || 0, 20) / 40 + (r.hasAnalysis ? 0.3 : 0), r]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  for (const pair of scored){
    if (out.length >= limit) break;
    seen.add(pair[1].key); out.push(pair[1]);
  }
  return out;
}

function topCounts(all, field, n){
  const m = new Map();
  for (const r of all){ const v = r[field]; if (!v) continue; m.set(v, (m.get(v) || 0) + 1); }
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]).slice(0, n)
    .map(e => e[0] + ' (' + e[1] + ')').join(' · ');
}

function corpusSummary(){
  if (!S.joined) return 'לא נטענו נתונים לצופה.';
  const all = S.joined.matched.concat(S.joined.noAnalysis, S.joined.inactive);
  const L = [];
  L.push('סה"כ אובייקטים: ' + all.length +
    ' | פעיל+נותח: ' + S.joined.matched.length +
    ' | פעיל ללא ניתוח: ' + S.joined.noAnalysis.length +
    ' | נותח ולא פעיל: ' + S.joined.inactive.length);
  if (S.cats)   L.push('נושאים ראשיים: ' + topCounts(all, 'mainTopic', 15));
  if (S.natmap){
    L.push('טריאז\': ' + topCounts(all, 'triage', 6));
    L.push('תחומים (DDM): ' + topCounts(all, 'domain', 15));
    const core = all.filter(r => r.hasNatmap).sort((a, b) => b.fanIn - a.fanIn).slice(0, 10)
      .map(r => r.id + ' (' + r.fanIn + ' קוראים)').join(' · ');
    L.push('הכי נקראים: ' + core);
  }
  if (S.files.size) L.push('קבצי מקור זמינים מקומית: ' + S.files.size);
  return L.join('\n');
}

function cut(arr, n){
  const a = (arr || []).slice(0, n);
  return a.join(', ') + ((arr || []).length > n ? ' …(+' + ((arr || []).length - n) + ')' : '');
}

function recBlock(r){
  const L = ['### ' + r.id];
  if (r.mainTopic || r.subTopic) L.push('נושא: ' + r.mainTopic + (r.subTopic ? ' / ' + r.subTopic : ''));
  if (r.objType)     L.push('סוג: ' + r.objType);
  if (r.description) L.push('תיאור: ' + r.description);
  if (r.catDesc && r.catDesc !== r.description) L.push('תיאור (קטגוריזציה): ' + r.catDesc);
  if (r.catWhat)     L.push('מה זה עושה: ' + r.catWhat);
  if (r.purpose && r.purpose !== r.catWhat) L.push('ניתוח LLM: ' + r.purpose);
  if (r.trigger)     L.push('טריגר: ' + r.trigger);
  if (r.sf)          L.push('יעד SF: ' + r.sf + (r.conf ? ' (ביטחון ' + r.conf + ')' : ''));
  if (r.triage)      L.push('טריאז\': ' + (TRIAGE_HE[r.triage] || r.triage));
  if (r.domain)      L.push('תחום DDM: ' + r.domain + (r.uiClass ? ' · ' + r.uiClass : ''));
  if (r.hasNatmap)   L.push('סטטי: קוראים=' + r.fanIn + ' יעדים=' + r.fanOut +
                       ' עומק=' + r.maxDepth + ' IF=' + r.ifCount + ' שורות=' + r.codeLines +
                       (r.writes ? ' כותב-ל-DB' : '') + (r.family ? ' משפחת-שכפול=' + r.family : ''));
  L.push('פעילות: ' + (r.isActive ? ('שימוש אחרון ' + (r.lastUsed || '—') + ', ספרייה ' + (r.library || '—'))
                                  : 'לא מופיע ברשימת הפעילות'));
  if (r.lastChange)  L.push('שינוי אחרון: ' + r.lastChange + ' (' + (r.nChanges || 0) + ' שינויים)');
  if (r.rules && r.rules.length)     L.push('חוקים עסקיים: ' + cut(r.rules, 8));
  if (r.entities && r.entities.length) L.push('ישויות: ' + cut(r.entities, 15));
  if (r.ddmList && r.ddmList.length) L.push('טבלאות: ' + cut(r.ddmList.map(d => d.ddm + (d.write ? '(W)' : '')), 15));
  if (r.callsOut && r.callsOut.length) L.push('קורא ל: ' + cut(r.callsOut, 25));
  if (r.callers && r.callers.length)   L.push('נקרא מ: ' + cut(r.callers, 25));
  if (r.dupSiblings && r.dupSiblings.length) L.push('קוד כמעט זהה ל: ' + cut(r.dupSiblings, 10));
  return L.join('\n');
}

// Turns the SI-960 source into readable text before it goes to the model.
function decodedText(text){
  return String(text).split(/\r?\n/)
    .map(l => decodeLine(l, 'auto').map(sg => sg.s).join(''))
    .join('\n');
}

async function buildContext(question){
  const recs = pickRecords(question, MAX_RECS);
  let text = '## סיכום הקורפוס\n' + corpusSummary() + '\n\n';
  text += '## רשומות רלוונטיות לשאלה (' + recs.length + ')\n' +
          (recs.length ? recs.map(recBlock).join('\n\n') : 'לא נמצאו רשומות תואמות.');
  let withCode = 0;
  if ($('chatCode').checked && S.files.size){
    for (const r of recs){
      if (withCode >= 3) break;
      if (!S.files.has(r.key)) continue;
      try {
        const raw = await readFileText(S.files.get(r.key));
        const dec = decodedText(raw).split('\n').slice(0, 500).join('\n');
        text += '\n\n## קוד מקור: ' + r.id + ' (עד 500 שורות, עברית מפוענחת)\n```\n' + dec + '\n```';
        withCode++;
      } catch(e){ /* unreadable file: skip it */ }
    }
  }
  if (text.length > MAX_CTX) text = text.slice(0, MAX_CTX) + '\n…(ההקשר נחתך)';
  return { text: text, recs: recs, withCode: withCode };
}

const SYS_PROMPT =
  'אתה עוזר ניתוח למיגרציה של מערכת Natural/Adabas ותיקה (משרד התחבורה, עולם הרכב) לפלטפורמה מודרנית.\n' +
  'המשתמש מריץ כלי דפדפן שמצליב: רשימת פעילות מהמיינפריים, ניתוח LLM, כותרות קוד, ' +
  'סריקה סטטית (natmap) וקובץ קטגוריזציה עם נושא ראשי/תת נושא.\n' +
  'בכל פנייה מצורף הקשר: סיכום כללי של הקורפוס + הרשומות שנמצאו רלוונטיות לשאלה, ולעיתים קוד מקור.\n' +
  'כללים:\n' +
  '1. ענה בעברית, קצר ולעניין, בלי מבוא ובלי סיכום מיותר.\n' +
  '2. הסתמך רק על ההקשר שצורף. אם משהו לא מופיע בו — אמור זאת מפורשות ואל תמציא.\n' +
  '3. ציין שמות אובייקטים מדויקים כשאתה מתייחס אליהם.\n' +
  '4. ההקשר הוא תת-קבוצה שנבחרה אוטומטית — אם נראה שחסר מידע, אמור איזה סינון או שאלה ' +
  'ממוקדת יותר יביאו אותו.\n' +
  '5. שים לב: עברית בקוד המקור מקודדת בתקן ישן (SI-960) ולעיתים מפוענחת חלקית.';

function textOf(j){
  const c = j && j.candidates && j.candidates[0];
  if (!c || !c.content || !Array.isArray(c.content.parts)) return '';
  return c.content.parts
    .filter(p => p && typeof p.text === 'string' && !p.thought)
    .map(p => p.text).join('');
}

async function callPlain(key, body, onText){
  const res = await fetch(GEM_BASE + ':generateContent', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text().catch(() => '')).slice(0, 500));
  const j = await res.json();
  const t = textOf(j);
  onText(t);
  return { text:t, usage:j.usageMetadata || null,
           finish:(j.candidates && j.candidates[0] && j.candidates[0].finishReason) || '' };
}

async function callGemini(key, contents, level, onText){
  const body = {
    systemInstruction:{ parts:[{ text: SYS_PROMPT }] },
    contents: contents,
    generationConfig:{ thinkingConfig:{ thinkingLevel: level }, maxOutputTokens: 8192 }
  };
  let res;
  try {
    res = await fetch(GEM_BASE + ':streamGenerateContent?alt=sse', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body)
    });
  } catch(err){
    throw new Error('הבקשה נכשלה ברמת הרשת: ' + (err && err.message ? err.message : String(err)) +
      '. אם הדף נפתח ישירות מ-file://, נסה להריץ אותו דרך שרת מקומי.');
  }
  if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text().catch(() => '')).slice(0, 500));
  if (!res.body) return await callPlain(key, body, onText);

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', full = '', usage = null, finish = '';
  for (;;){
    const chunk = await reader.read();
    if (chunk.done) break;
    buf += dec.decode(chunk.value, { stream:true });
    let nl;
    while ((nl = buf.indexOf('\n')) !== -1){
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (line.indexOf('data:') !== 0) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      let j;
      try { j = JSON.parse(payload); } catch(e){ continue; }
      if (j.promptFeedback && j.promptFeedback.blockReason)
        throw new Error('הבקשה נחסמה על ידי המסננים: ' + j.promptFeedback.blockReason);
      const t = textOf(j);
      if (t){ full += t; onText(full); }
      if (j.usageMetadata) usage = j.usageMetadata;
      const c = j.candidates && j.candidates[0];
      if (c && c.finishReason) finish = c.finishReason;
    }
  }
  return { text: full, usage: usage, finish: finish };
}

/* ---------- chat UI ---------- */
function chatScroll(){ const b = $('chatBody'); b.scrollTop = b.scrollHeight; }

function addMsg(cls, who, html){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who">' + esc(who) + '</div><div class="bd">' + html + '</div>';
  $('chatBody').appendChild(d);
  chatScroll();
  return d;
}

function renderKeyPrompt(){
  const d = addMsg('a', 'הגדרת מפתח',
    'כדי להשתמש בצ\'אט צריך מפתח Gemini API. הוא נשמר רק בדפדפן הזה (localStorage) ' +
    'ונשלח ישירות ל-Google.<br><br>' +
    '<input type="password" id="keyIn" placeholder="AIza..." ' +
    'style="min-width:320px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);' +
    'border-radius:6px;padding:7px 9px;font-family:Consolas,monospace;direction:ltr"> ' +
    '<button id="keySave">שמור</button> ' +
    '<button id="keyDel">מחק מפתח שמור</button>' +
    '<div style="margin-top:8px;color:var(--dim);font-size:12px">' +
    'מפתח מ-aistudio.google.com/apikey. שים לב: תוכן ההקשר נשלח לשרתי Google.</div>');
  const inp = d.querySelector('#keyIn');
  inp.value = getKey();
  inp.focus();
  d.querySelector('#keySave').onclick = () => {
    const v = inp.value.trim();
    if (!v) return;
    lsSet(KEY_LS, v);
    d.querySelector('.bd').innerHTML = 'המפתח נשמר מקומית. אפשר לשאול.';
  };
  d.querySelector('#keyDel').onclick = () => {
    lsDel(KEY_LS);
    inp.value = '';
    d.querySelector('.bd').innerHTML = 'המפתח נמחק מהדפדפן.';
  };
}

function openChat(){
  $('chatWrap').classList.add('on');
  if (!$('chatBody').children.length){
    if (!getKey()) renderKeyPrompt();
    else addMsg('a', 'מוכן',
      S.joined ? 'שאל כל דבר על הנתונים שנטענו. ההקשר נבנה אוטומטית מהרשומות הרלוונטיות לשאלה.'
               : 'עדיין לא נטענו קבצים לצופה — אפשר לשאול, אבל אין הקשר לשלוח.');
  }
  $('chatIn').focus();
}
function closeChat(){ $('chatWrap').classList.remove('on'); }

async function chatSend(){
  if (CHAT.busy) return;
  const q = $('chatIn').value.trim();
  if (!q) return;
  const key = getKey();
  if (!key){ renderKeyPrompt(); return; }

  CHAT.busy = true;
  $('chatSend').disabled = true;
  $('chatIn').value = '';
  addMsg('u', 'אתה', md(q));

  const holder = addMsg('a', GEM_MODEL, '<span class="dots">חושב</span>');
  const bd = holder.querySelector('.bd');
  const t0 = Date.now();
  try {
    const ctx = await buildContext(q);
    $('chatCtxInfo').textContent = 'הקשר: ' + ctx.recs.length + ' רשומות · ' +
      Math.round(ctx.text.length / 1000) + 'K תווים' + (ctx.withCode ? ' · ' + ctx.withCode + ' קבצי קוד' : '');
    const contents = CHAT.hist.map(m => ({ role:m.role, parts:[{ text:m.text }] }));
    contents.push({ role:'user', parts:[{ text: ctx.text + '\n\n## שאלה\n' + q }] });

    const out = await callGemini(key, contents, $('chatThink').value, t => { bd.innerHTML = md(t); chatScroll(); });
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (!out.text){
      bd.innerHTML = '<span style="color:var(--warn)">התקבלה תשובה ריקה' +
        (out.finish ? ' (finishReason: ' + esc(out.finish) + ')' : '') + '.</span>';
    } else {
      bd.innerHTML = md(out.text);
      CHAT.hist.push({ role:'user', text:q });
      CHAT.hist.push({ role:'model', text:out.text });
      if (CHAT.hist.length > 20) CHAT.hist = CHAT.hist.slice(-20);
    }
    const u = out.usage || {};
    $('chatStat').textContent = secs + ' שנ\'' +
      (u.promptTokenCount ? ' · קלט ' + u.promptTokenCount + ' טוקנים' : '') +
      (u.candidatesTokenCount ? ' · פלט ' + u.candidatesTokenCount : '') +
      (u.thoughtsTokenCount ? ' · חשיבה ' + u.thoughtsTokenCount : '');
    const det = document.createElement('details');
    det.className = 'ctx';
    det.innerHTML = '<summary style="cursor:pointer">ההקשר שנשלח (' + ctx.recs.length + ' רשומות)</summary>' +
      '<pre>' + esc(ctx.text.slice(0, 20000)) + (ctx.text.length > 20000 ? '\n…' : '') + '</pre>';
    holder.appendChild(det);
  } catch(err){
    bd.innerHTML = '<span style="color:var(--bad)">' + esc(err && err.message ? err.message : String(err)) + '</span>';
    holder.className = 'msg e';
  } finally {
    CHAT.busy = false;
    $('chatSend').disabled = false;
    chatScroll();
  }
}

$('chatFab').addEventListener('click', openChat);
$('chatClose').addEventListener('click', closeChat);
$('chatKey').addEventListener('click', renderKeyPrompt);
$('chatSend').addEventListener('click', chatSend);
$('chatClear').addEventListener('click', () => {
  CHAT.hist = []; $('chatBody').innerHTML = ''; $('chatStat').textContent = '';
  $('chatCtxInfo').textContent = '';
  openChat();
});
$('chatIn').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); chatSend(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('chatWrap').classList.contains('on')) closeChat();
});
$('chatThink').value = lsGet('nv.think', 'high');
$('chatCode').checked = lsGet('nv.chatCode', '0') === '1';
$('chatFiltered').checked = lsGet('nv.chatFiltered', '0') === '1';
$('chatThink').addEventListener('change', () => lsSet('nv.think', $('chatThink').value));
$('chatCode').addEventListener('change', () => lsSet('nv.chatCode', $('chatCode').checked ? '1' : '0'));
$('chatFiltered').addEventListener('change', () => lsSet('nv.chatFiltered', $('chatFiltered').checked ? '1' : '0'));

$('btnCsv').addEventListener('click', () => {
  if (!S.view.length) return;
  const blob = new Blob(['\uFEFF' + toCsv(S.view)], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'natural-' + S.tab + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
